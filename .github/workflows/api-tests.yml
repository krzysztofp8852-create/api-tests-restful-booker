name: API Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  newman:
    name: Newman — Restful Booker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Postman collection (Newman)
        run: npm test

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/
          if-no-files-found: ignore
